services:
  auth-server:
    ports:
      - target: 8080
        published: "${SSO_LOCAL_AUTH_SERVER_PORT:?SSO_LOCAL_AUTH_SERVER_PORT must be set}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      SPRING_PROFILES_ACTIVE: test
      SERVER_FORWARD_HEADERS_STRATEGY: none
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32
      SESSION_COOKIE_SECURE: "false"
      AUTH_PUBLIC_URL: http://127.0.0.1:${SSO_LOCAL_AUTH_WEB_PORT:?SSO_LOCAL_AUTH_WEB_PORT must be set}
      HR_REDIRECT_URI: http://127.0.0.1:${SSO_LOCAL_HR_WEB_PORT:?SSO_LOCAL_HR_WEB_PORT must be set}/login/oauth2/code/hr-client
      HR_POST_LOGOUT_REDIRECT_URI: http://127.0.0.1:${SSO_LOCAL_HR_WEB_PORT:?SSO_LOCAL_HR_WEB_PORT must be set}/
      APPROVAL_REDIRECT_URI: http://127.0.0.1:${SSO_LOCAL_APPROVAL_WEB_PORT:?SSO_LOCAL_APPROVAL_WEB_PORT must be set}/login/oauth2/code/approval-client
      APPROVAL_POST_LOGOUT_REDIRECT_URI: http://127.0.0.1:${SSO_LOCAL_APPROVAL_WEB_PORT:?SSO_LOCAL_APPROVAL_WEB_PORT must be set}/
      ADMIN_REDIRECT_URI: http://127.0.0.1:${SSO_LOCAL_ADMIN_WEB_PORT:?SSO_LOCAL_ADMIN_WEB_PORT must be set}/login/oauth2/code/admin-client
      ADMIN_POST_LOGOUT_REDIRECT_URI: http://127.0.0.1:${SSO_LOCAL_ADMIN_WEB_PORT:?SSO_LOCAL_ADMIN_WEB_PORT must be set}/
      TURNSTILE_ENABLED: "false"
      GMAIL_SMTP_ENABLED: "false"
      SSO_TEST_SUPPORT_ENABLED: ${SSO_TEST_SUPPORT_ENABLED:-false}
      TEST_SUPPORT_API_KEY: ${TEST_SUPPORT_API_KEY:-}

  admin-server:
    ports:
      - target: 8080
        published: "${SSO_LOCAL_ADMIN_SERVER_PORT:?SSO_LOCAL_ADMIN_SERVER_PORT must be set}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      SPRING_PROFILES_ACTIVE: test
      SERVER_FORWARD_HEADERS_STRATEGY: none
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32
      SESSION_COOKIE_SECURE: "false"
      SERVER_SERVLET_SESSION_COOKIE_NAME: SSO_LAB_ADMIN_SESSION
      AUTH_PUBLIC_URL: http://127.0.0.1:${SSO_LOCAL_AUTH_WEB_PORT:?SSO_LOCAL_AUTH_WEB_PORT must be set}
      ADMIN_REDIRECT_URI: http://127.0.0.1:${SSO_LOCAL_ADMIN_WEB_PORT:?SSO_LOCAL_ADMIN_WEB_PORT must be set}/login/oauth2/code/admin-client
      ADMIN_POST_LOGOUT_REDIRECT_URI: http://127.0.0.1:${SSO_LOCAL_ADMIN_WEB_PORT:?SSO_LOCAL_ADMIN_WEB_PORT must be set}/

  hr-server:
    ports:
      - target: 8080
        published: "${SSO_LOCAL_HR_SERVER_PORT:?SSO_LOCAL_HR_SERVER_PORT must be set}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      SPRING_PROFILES_ACTIVE: test
      SERVER_FORWARD_HEADERS_STRATEGY: none
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32
      SESSION_COOKIE_SECURE: "false"
      SERVER_SERVLET_SESSION_COOKIE_NAME: SSO_LAB_HR_SESSION
      AUTH_PUBLIC_URL: http://127.0.0.1:${SSO_LOCAL_AUTH_WEB_PORT:?SSO_LOCAL_AUTH_WEB_PORT must be set}
      HR_REDIRECT_URI: http://127.0.0.1:${SSO_LOCAL_HR_WEB_PORT:?SSO_LOCAL_HR_WEB_PORT must be set}/login/oauth2/code/hr-client
      HR_POST_LOGOUT_REDIRECT_URI: http://127.0.0.1:${SSO_LOCAL_HR_WEB_PORT:?SSO_LOCAL_HR_WEB_PORT must be set}/

  approval-server:
    ports:
      - target: 8080
        published: "${SSO_LOCAL_APPROVAL_SERVER_PORT:?SSO_LOCAL_APPROVAL_SERVER_PORT must be set}"
        host_ip: 127.0.0.1
        protocol: tcp
    environment:
      SPRING_PROFILES_ACTIVE: test
      SERVER_FORWARD_HEADERS_STRATEGY: none
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32
      SESSION_COOKIE_SECURE: "false"
      SERVER_SERVLET_SESSION_COOKIE_NAME: SSO_LAB_APPROVAL_SESSION
      AUTH_PUBLIC_URL: http://127.0.0.1:${SSO_LOCAL_AUTH_WEB_PORT:?SSO_LOCAL_AUTH_WEB_PORT must be set}
      APPROVAL_REDIRECT_URI: http://127.0.0.1:${SSO_LOCAL_APPROVAL_WEB_PORT:?SSO_LOCAL_APPROVAL_WEB_PORT must be set}/login/oauth2/code/approval-client
      APPROVAL_POST_LOGOUT_REDIRECT_URI: http://127.0.0.1:${SSO_LOCAL_APPROVAL_WEB_PORT:?SSO_LOCAL_APPROVAL_WEB_PORT must be set}/

  auth-web:
    environment:
      TURNSTILE_ENABLED: "false"
      TURNSTILE_SITE_KEY: ""
