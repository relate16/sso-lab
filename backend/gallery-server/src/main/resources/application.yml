spring:
  application:
    name: gallery-server
  datasource:
    url: ${GALLERY_DB_URL:jdbc:postgresql://localhost:5432/sso_lab}
    username: ${POSTGRES_USER:sso_lab}
    password: ${POSTGRES_PASSWORD:}
    hikari:
      connection-init-sql: SET search_path TO gallery, public
  flyway:
    enabled: true
    create-schemas: true
    default-schema: gallery
    schemas: gallery
    locations: classpath:db/migration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: gallery

server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  tomcat:
    remoteip:
      internal-proxies: ${TRUSTED_PROXY_CIDRS:127.0.0.1/32}
      remote-ip-header: X-Forwarded-For
      protocol-header: X-Forwarded-Proto
      host-header: X-Forwarded-Host
      port-header: X-Forwarded-Port
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: lax

gallery:
  storage:
    root: ${GALLERY_STORAGE_ROOT:./.tooling/gallery-storage}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
